<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="marketing docs">
  {% include site-header.html %}
  <main class="doc">
    <article>
      {% if page.title %}
      <div class="page-head">
        {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
      </div>
      {% endif %}
      {{ content }}
    </article>
  </main>
  {% include site-footer.html %}
</body>
</html>
